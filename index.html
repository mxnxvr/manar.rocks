<style>
/* Layout: a pixel-art desktop over Muttrah at dusk (canvas wallpaper), dusk-toned windows with stepped pixel corners, and a taskbar. One committed look, no dark/light switch. */
:root {
  color-scheme: dark;
  --ink: #1b1626;          /* deepest surface: terminal, boot screen, text on bright fills */
  --text: #f3e8dd;         /* text on dark surfaces */
  --line: #4b3f5f;         /* outlines */
  --paper: #241e33;        /* window face */
  --paper-2: #302841;      /* bevels, inactive surfaces */
  --acc: #e98a6a;          /* active title bar, start: dusk coral */
  --acc-soft: #4a2f3c;
  --mint: #9ccfb7;
  --amber: #f2b56b;
  --lav: #8a7a9e;          /* inactive title bar */
  --lav-2: #8f9fd9;
  --sky: #6a5d8c;
  --muted: #a596b0;
  --c-hi: #f2a07b;         /* chrome: bright line */
  --c-lo: #5a4466;         /* chrome: dim line */
  --hud: #1f1a2c;          /* taskbar, menu */
  --hud-2: #2a2339;
  --hud-text: #f0dccd;
  --shadow: rgba(10, 6, 20, .45);
  --f-pixel: "Silkscreen", "Courier New", monospace;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --f-term: "VT323", ui-monospace, Consolas, monospace;
  --px: 3px;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body {
  background: #2b2c5c; color: var(--text);
  font-family: var(--f-body); font-size: 15px; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px dashed var(--amber); outline-offset: 2px; }
svg[shape-rendering] { display: block; }
code { font-family: var(--f-term); font-size: 1.25em; }

.pix {
  box-shadow:
    0 calc(-1 * var(--px)) 0 var(--line), 0 var(--px) 0 var(--line),
    calc(-1 * var(--px)) 0 0 var(--line), var(--px) 0 0 var(--line);
}

/* ---------- Desktop ---------- */
#os { position: fixed; inset: 0; }
#desktop { position: absolute; inset: 0; overflow: hidden; }
#wall { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
#icons {
  position: absolute; inset: 0; padding: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  display: grid; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 96px);
  grid-auto-columns: 96px; gap: 4px; align-content: start; pointer-events: none;
}
#taskbar :focus-visible, #icons :focus-visible { outline-color: var(--amber); }
.dicon {
  pointer-events: auto;
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  background: none; border: 0; padding: 6px 2px; color: #f7eee2;
  font-family: var(--f-pixel); font-size: 13px; line-height: 1.15; text-align: center;
}
.dicon svg { width: 46px; height: 46px; filter: drop-shadow(2px 3px 0 rgba(40, 24, 50, .45)); transition: transform .15s steps(2); }
.dicon:hover svg { transform: translateY(-2px); }
.dicon .lbl { background: rgba(36, 28, 58, .62); padding: 1px 6px; }
.dicon.sel .lbl { background: var(--acc); color: var(--ink); }

/* ---------- Doki ---------- */
#doki {
  position: absolute; right: max(28px, env(safe-area-inset-right, 0px)); bottom: 18px;
  background: none; border: 0; padding: 0; width: 96px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-family: var(--f-pixel); font-size: 14px;
}
#doki svg { width: 90px; height: 77px; filter: drop-shadow(4px 4px 0 var(--shadow)); }
#doki span { background: rgba(36, 28, 58, .62); color: #f7eee2; font-family: var(--f-pixel); font-size: 13px; line-height: 1.3; padding: 0 6px; }
#doki.hop svg { animation: hop .5s steps(4); }
@keyframes hop { 0%,100% { transform: translateY(0) } 40% { transform: translateY(-12px) } 70% { transform: translateY(-3px) } }
#bubble {
  position: absolute; right: max(28px, env(safe-area-inset-right, 0px)); bottom: 128px; max-width: 250px;
  background: var(--paper); color: var(--text); padding: 8px 12px;
  font-family: var(--f-pixel); font-size: 15px; line-height: 1.3; overflow-wrap: anywhere;
  filter: drop-shadow(4px 4px 0 var(--shadow));
}
#bubble::after {
  content: ""; position: absolute; right: 40px; bottom: -12px; width: 12px; height: 9px;
  background: var(--line); clip-path: polygon(0 0, 100% 0, 0 100%);
}

/* ---------- Windows ---------- */
.win {
  position: absolute; display: flex; flex-direction: column; background: var(--paper);
  box-shadow:
    0 calc(-1 * var(--px)) 0 var(--line), 0 var(--px) 0 var(--line),
    calc(-1 * var(--px)) 0 0 var(--line), var(--px) 0 0 var(--line),
    9px 9px 0 var(--shadow);
  min-width: 240px; min-height: 140px; max-height: calc(100% - 86px); max-width: calc(100% - 20px);
  resize: both; overflow: hidden;
}
.win.max { left: 3px !important; top: 3px !important; width: calc(100% - 6px) !important; height: calc(100% - 80px) !important; max-width: none; max-height: none; resize: none; }
.tbar {
  display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 8px;
  background: #322a44; color: var(--muted); cursor: grab; user-select: none; touch-action: none;
  border-bottom: var(--px) solid var(--line);
}
.win.active .tbar { background: var(--acc); color: var(--ink); }
.win.active { box-shadow: 0 -3px 0 var(--c-lo), 0 3px 0 var(--c-lo), -3px 0 0 var(--c-lo), 3px 0 0 var(--c-lo), 9px 9px 0 var(--shadow), 0 0 28px rgba(233, 138, 106, .15); }
.tbar:active { cursor: grabbing; }
.tbar .ticon svg { width: 20px; height: 20px; }
.ttl { flex: 1; min-width: 0; font-family: var(--f-pixel); font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbtns { display: flex; gap: 5px; }
.tbtns button {
  width: 24px; height: 22px; padding: 0; display: grid; place-items: center;
  background: var(--paper); border: 2px solid var(--line);
  font-family: var(--f-pixel); font-size: 14px; line-height: 1;
  box-shadow: 0 2px 0 var(--line);
}
.tbtns button { color: var(--text); }
.tbtns button[data-a="close"] { background: var(--amber); color: var(--ink); }
.tbtns button:active { transform: translateY(2px); box-shadow: none; }
.wbody { flex: 1; min-height: 0; overflow: auto; }
.menubar { display: flex; gap: 16px; padding: 4px 12px; border-bottom: 2px solid var(--paper-2); font-family: var(--f-pixel); font-size: 14px; color: var(--muted); }
.btn {
  background: var(--paper); border: 2px solid var(--line); padding: 4px 10px;
  font-family: var(--f-pixel); font-size: 14px; box-shadow: 0 3px 0 var(--line); color: var(--text);
}
.btn:active { transform: translateY(3px); box-shadow: none; }
.btn[aria-pressed="true"] { background: var(--acc-soft); transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.btn:disabled { opacity: .5; cursor: default; }
.tabs { display: flex; gap: 6px; padding: 8px 10px 0; border-bottom: var(--px) solid var(--line); }
.tabs button {
  font-family: var(--f-pixel); font-size: 14px; padding: 4px 12px; background: var(--paper-2);
  border: 2px solid var(--line); border-bottom: 0; margin-bottom: -1px;
}
.tabs button[aria-selected="true"] { background: var(--paper); position: relative; top: 1px; padding-bottom: 6px; }

/* About */
.note { padding: 18px 20px; min-height: 100%; background: var(--paper); outline: none; line-height: 1.65; font-size: 16px; white-space: pre-wrap; max-width: 64ch; }
.note h1 { font-family: var(--f-pixel); font-size: 32px; font-weight: 700; margin: 0; line-height: 1.1; }
.note .sub { display: block; font-family: var(--f-pixel); color: var(--muted); font-size: 15px; }
.note mark { background: var(--acc-soft); padding: 0 3px; }
.note b { font-family: var(--f-pixel); font-weight: 600; font-size: 17px; }
.note code { color: var(--ink); background: var(--amber); padding: 0 4px; }

/* Projects */
.proj { display: grid; grid-template-columns: 170px 1fr; height: 100%; }
.proj ul { list-style: none; margin: 0; padding: 8px; border-right: var(--px) solid var(--paper-2); display: grid; gap: 4px; align-content: start; }
.proj li button { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; background: none; border: 0; padding: 6px; font-family: var(--f-pixel); font-size: 14px; }
.proj li button svg { width: 24px; height: 24px; flex: none; }
.proj li button[aria-current="true"] { background: var(--acc-soft); box-shadow: inset 0 0 0 2px var(--line); }
.proj article { padding: 18px 20px; min-width: 0; }
.proj h2 { font-family: var(--f-pixel); font-weight: 700; font-size: 24px; margin: 0 0 2px; }
.proj .meta { font-family: var(--f-pixel); font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.proj p { line-height: 1.6; margin: 0 0 14px; max-width: 60ch; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tags span { font-family: var(--f-pixel); font-size: 13px; padding: 1px 8px; background: var(--mint); border: 2px solid var(--line); color: var(--ink); }
.tags span:nth-child(3n+2) { background: var(--amber); }
.tags span:nth-child(3n) { background: #8e99a6; }

/* Terminal */
.term { height: 100%; background: var(--ink); color: var(--text); font-family: var(--f-term); font-size: 20px; line-height: 1.15; padding: 10px 14px; display: flex; flex-direction: column; overflow: auto; }
.term pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: inherit; }
.term .p { color: var(--acc); }
.term .err { color: var(--amber); }
.term .ok { color: var(--mint); }
.term form { display: flex; gap: 8px; }
.term input { flex: 1; min-width: 0; background: none; border: 0; color: inherit; font: inherit; outline: none; caret-color: var(--mint); }

/* CTF */
.ctf { padding: 16px 18px; display: grid; gap: 14px; }
.ctf-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.ctf-head h2 { font-family: var(--f-pixel); font-size: 24px; margin: 0; }
.ctf-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.score { font-family: var(--f-term); font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.meter { height: 14px; background: var(--paper-2); box-shadow: inset 0 0 0 2px var(--line); padding: 3px; }
.meter i { display: block; height: 100%; background: var(--mint); width: 0; transition: width .4s steps(8); }
.submit { display: flex; gap: 8px; }
.submit input {
  flex: 1; min-width: 0; font-family: var(--f-term); font-size: 20px; padding: 2px 10px;
  border: 2px solid var(--line); background: var(--ink); color: var(--text);
}
.ctf-msg { margin: -6px 0 0; min-height: 1.4em; font-family: var(--f-pixel); font-size: 14px; }
.ctf-msg.good { color: var(--c-hi); } .ctf-msg.bad { color: #e0806a; }
.chal { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }

})();

const PAL = { k: "#0b1118", w: "#e7e3d8", p: "#3fa58e", q: "#bfe0d5", y: "#d9a441", o: "#b5862f", m: "#8fd1b0", b: "#6f8fb5", l: "#8e99a6", s: "#1b2733", g: "#ffffff", r: "#c96f6f", c: "#f2a07b", d: "#5a4466", a: "#f2b56b" };
function sprite(rows) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  let out = "";
  rows.forEach((row, y) => {
    let x = 0;
    while (x < row.length) {
      const c = row[x];
      if (c === "." || !PAL[c]) { x++; continue; }
      let e = x; while (e < row.length && row[e] === c) e++;
      out += `<rect x="${x}" y="${y}" width="${e - x}" height="1" fill="${PAL[c]}"/>`;
      x = e;
    }
  });
  return `<svg viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true">${out}</svg>`;
}

function playIntro(done, zoomOut) {

  let rect = null, live = true, going = false, last = 0;
  function fit() {
    const w = Math.ceil(innerWidth / RPX), h = Math.ceil(innerHeight / RPX);
    room.size(w, h);
    const kx = innerWidth / w, ky = innerHeight / h, r = room.screen;
    rect = { x: r.x * kx, y: r.y * ky, w: r.w * kx, h: r.h * ky };
    Object.assign(scr.style, { left: rect.x + "px", top: rect.y + "px", width: rect.w + "px", height: rect.h + "px", fontSize: Math.max(10, rect.w * .085) + "px" });
    room.draw(performance.now());

  /* the transform that makes the monitor screen fill the viewport */
  const zoomedIn = () => {

  addEventListener("resize", fit, on);

    const z = zoomedIn();
    intro.style.transformOrigin = z.origin; intro.style.transform = z.transform;
    intro.getBoundingClientRect();
    intro.style.transition = "transform 1.5s cubic-bezier(.65, 0, .25, 1)"; intro.style.transform = "none";
  }
  const loop = t => {
    if (!live) return;

    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);

    intro.style.transition = "opacity .5s"; intro.style.opacity = "0";

  }

    if (going) return; going = true;

    Sound.setScene("login"); Sound.play("login");

    const z = zoomedIn();
    intro.style.transformOrigin = z.origin;
    intro.style.transition = "transform 1.5s cubic-bezier(.65, 0, .25, 1)";

try { solved = new Set(JSON.parse(localStorage.getItem("manaros-ctf") || "[]")); } catch (e) {}
function saveSolved() { try { localStorage.setItem("manaros-ctf", JSON.stringify([...solved])); } catch (e) {} }
const rooted = () => solved.size === CTF.length;
function updateFlagCount() { $("#flagcount span").textContent = `${solved.size}/${CTF.length}`; document.body.classList.toggle("rooted", rooted()); }
updateFlagCount();
async function sha256(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function mountCTF(body) {
  body.innerHTML = `<div class="ctf">
    <div class="ctf-head"><div><h2>Capture the flag</h2><p>Flags look like <code>manar{...}</code>. Found one? Paste it below.</p></div><div class="score"></div></div>
    <div class="meter"><i></i></div>
    <form class="submit"><input id="ctf-input" placeholder="manar{...}" autocomplete="off" spellcheck="false" aria-label="Flag"><button class="btn">Submit</button></form>
    <p class="ctf-msg" role="status"></p>
    <div class="root" hidden>${DOKI}<div><b>Root access granted</b><p>All ${CTF.length} flags, full marks. This machine is yours now: new terminals log you in as root, and Doki has filed a report. Tell Manar you did it.</p><button class="btn" type="button" data-contact>Open contact.exe</button></div></div>
    <ul class="chal"></ul>
    <div class="ctf-foot"><span>Progress is saved in this browser only.</span><button class="btn reset" type="button">Reset progress</button></div>
  </div>`;
  const list = $(".chal", body), msg = $(".ctf-msg", body), input = $("input", body), reset = $(".reset", body);
  const total = CTF.reduce((a, c) => a + c.pts, 0);
  function render() {
    const got = CTF.filter(c => solved.has(c.id)).reduce((a, c) => a + c.pts, 0);
    $(".score", body).textContent = `${got}/${total} pts`;
    $(".meter i", body).style.width = (got / total * 100) + "%";
    list.innerHTML = "";
    CTF.forEach(c => {
      const li = document.createElement("li");
      if (solved.has(c.id)) li.className = "done";
      li.innerHTML = `<span class="box">${solved.has(c.id) ? "✓" : ""}</span><span class="nm"></span><span class="pts">${c.pts}</span><button class="btn hb" type="button" aria-expanded="false">Hint</button><p class="hint" hidden></p>`;
      $(".nm", li).innerHTML = `<span></span><span class="cat">${c.cat}</span>`;
      $(".nm span", li).textContent = c.name;
      $(".hint", li).textContent = c.hint;
      $(".hb", li).addEventListener("click", e => {
        const h = $(".hint", li); h.hidden = !h.hidden; e.currentTarget.setAttribute("aria-expanded", String(!h.hidden));
      });
      list.appendChild(li);
    });
    updateFlagCount();
    $(".root", body).hidden = !rooted();
  }
  $("[data-contact]", body).addEventListener("click", () => openApp("contact"));
  $("form", body).addEventListener("submit", async e => {
    e.preventDefault();
    const val = input.value.trim();
    if (!val) return;
    let h;
    try { h = await sha256(val); } catch (err) { msg.className = "ctf-msg bad"; msg.textContent = "This browser can't check flags here. Try opening the site over https."; return; }
    const hit = CTF.find(c => c.hash === h);
    if (!hit) { Sound.play("wrong"); msg.className = "ctf-msg bad"; msg.textContent = "That's not a flag. Check for typos, and keep the manar{...} part."; return; }
    input.value = "";
    if (solved.has(hit.id)) { msg.className = "ctf-msg good"; msg.textContent = `You already have "${hit.name}".`; return; }
    solved.add(hit.id); saveSolved(); render();
    if (!rooted()) Sound.play("flag");
    msg.className = "ctf-msg good";
    msg.textContent = solved.size === CTF.length ? `"${hit.name}" +${hit.pts}. That's all of them. Nicely done.` : `Correct! "${hit.name}" +${hit.pts} pts.`;
    if (rooted()) { grantedScreen(); setTimeout(() => dokiSay("All flags captured. I'm impressed, and I'm hard to impress."), 2600); }
  });
  let armed = false;
  reset.addEventListener("click", () => {
    if (!armed) { armed = true; reset.textContent = "Click again to reset"; setTimeout(() => { armed = false; reset.textContent = "Reset progress"; }, 3000); return; }
    solved.clear(); saveSolved(); render(); armed = false; reset.textContent = "Reset progress";
    msg.className = "ctf-msg"; msg.textContent = "Progress cleared.";
  });
  render();
}

    ctf: () => { openApp("ctf"); return "Opening CTF scoreboard…"; },
    sudo: a => {

      sudoFor = a; promptEl.textContent = "[sudo] password for manar:"; input.type = "password";
      return null;
    },
    neofetch: () => {
      const m = Math.max(1, Math.round((Date.now() - started) / 60000));
      return `   /\\_/\\        ${ME.name.toLowerCase()}@manar.rocks
  ( ■_■ )       ------------------
   > ^ <        OS: ManarOS 2.1
                Host: manar.rocks
                Uptime: ${m} min

                Theme: Pastel Pixel

/* ---------- Chess ---------- */
const PUZZLE = "r1b2k1r/ppp1bppp/8/1B1Q4/5q2/2P5/PPP2PPP/R3R1K1 w - - 1 1";
const PV = { p: 100, n: 310, b: 330, r: 500, q: 900, k: 0 };
function evaluate(g) {
  let s = 0; const b = g.board();
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const p = b[r][c]; if (!p) continue;
    let v = PV[p.type];
    if (p.type !== "k" && p.type !== "r") v += (7 - Math.abs(3.5 - r) - Math.abs(3.5 - c)) * 3;
    if (p.type === "p") v += (p.color === "w" ? 6 - r : r - 1) * 5;
    s += p.color === "w" ? v : -v;
  }
  return s;
}
function search(g, d, a, b) {
  if (d === 0) return evaluate(g);
  const ms = g.moves({ verbose: true });
  if (!ms.length) return g.in_check() ? (g.turn() === "w" ? -1e5 - d : 1e5 + d) : 0;
  ms.sort((x, y) => (y.captured ? PV[y.captured] : 0) - (x.captured ? PV[x.captured] : 0));
  let best = g.turn() === "w" ? -Infinity : Infinity;
  for (const m of ms) {
    g.move(m); const v = search(g, d - 1, a, b); g.undo();
    if (g.turn() === "w") { best = Math.max(best, v); a = Math.max(a, best); }
    else { best = Math.min(best, v); b = Math.min(b, best); }
    if (a >= b) break;
  }
  return best;
}
function bestBlack(g, depth) {
  let best = null, bs = Infinity;
  for (const m of g.moves({ verbose: true })) {
    g.move(m); const s = search(g, depth - 1, -Infinity, Infinity) + Math.random() * 8; g.undo();
    if (s < bs) { bs = s; best = m; }
  }
  return best;
}
function hasMateInOne(g) {
  return g.moves().some(m => { g.move(m); const c = g.in_checkmate(); g.undo(); return c; });
}
function mountChess(body) {
  if (!window.Chess) { body.innerHTML = `<p style="padding:20px">The chess engine didn't load. Check your connection and reopen Chess.</p>`; return; }
  body.innerHTML = `<div class="tabs" role="tablist"><button role="tab" data-m="play" aria-selected="true">Play</button><button role="tab" data-m="puzzle" aria-selected="false">Puzzle</button></div>
    <div class="chess"><div class="cboard" role="grid" aria-label="Chess board"></div><p class="cstatus" role="status"></p>
    <div class="cbtns"><button class="btn" data-a="new">New game</button><button class="btn" data-a="undo">Undo</button></div></div>`;
  const board = $(".cboard", body), status = $(".cstatus", body), newBtn = $('[data-a="new"]', body), undoBtn = $('[data-a="undo"]', body);
  const GL = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
  let mode = "play", game, sel = null, last = null, busy = false, userMoves = 0, done = false;
  const say = (html) => { status.innerHTML = html; };
  function start() {
    sel = null; last = null; busy = false; userMoves = 0; done = false;
    if (mode === "play") { game = new Chess(); say("You're white. Doki plays black."); newBtn.textContent = "New game"; undoBtn.hidden = false; }
    else { game = new Chess(PUZZLE); say("White to move and mate in 2."); newBtn.textContent = "Reset puzzle"; undoBtn.hidden = true; }
    render();
  }
  function render() {
    board.innerHTML = "";
    const targets = sel ? game.moves({ square: sel, verbose: true }) : [];
    let kingSq = null;
    if (game.in_check()) {
      const b = game.board();
      b.forEach((row, r) => row.forEach((p, c) => { if (p && p.type === "k" && p.color === game.turn()) kingSq = "abcdefgh"[c] + (8 - r); }));
    }
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const sq = "abcdefgh"[c] + (8 - r), p = game.get(sq);
      const b = document.createElement("button");
      b.className = "sq" + ((r + c) % 2 ? " dk" : "");
      if (last && (sq === last[0] || sq === last[1])) b.classList.add("last");
      if (sq === sel) b.classList.add("sel");
      if (sq === kingSq) b.classList.add("chk");
      const t = targets.find(m => m.to === sq);
      if (t) b.classList.add("tgt", ...(t.captured ? ["cap"] : []));
      if (p) { b.textContent = GL[p.type] + "︎"; b.classList.add(p.color === "w" ? "pc-w" : "pc-b"); }
      b.setAttribute("aria-label", sq + (p ? ` ${p.color === "w" ? "white" : "black"} ${({ k: "king", q: "queen", r: "rook", b: "bishop", n: "knight", p: "pawn" })[p.type]}` : ""));
      b.addEventListener("click", () => click(sq));
      board.appendChild(b);
    }
  }
  function click(sq) {
    if (busy || done || game.turn() !== "w") return;
    const p = game.get(sq);
    if (sel && game.moves({ square: sel, verbose: true }).some(m => m.to === sq)) { play(sel, sq); return; }
    sel = p && p.color === "w" ? sq : null;
    render();
  }
  function play(from, to) {
    game.move({ from, to, promotion: "q" }); Sound.play("move");
    last = [from, to]; sel = null; render();
    if (mode === "play") afterPlay(); else afterPuzzle();
  }
  function afterPlay() {
    if (game.game_over()) return endPlay();
    busy = true; say("Doki is thinking…");
    setTimeout(() => {
      const m = bestBlack(game, 3);
      game.move(m); last = [m.from, m.to]; busy = false; render(); Sound.play("move");
      if (game.game_over()) endPlay(); else say(game.in_check() ? "Check! Your move." : "Your move.");
    }, 60);
  }
  function endPlay() {
    done = true;
    if (game.in_checkmate()) say(game.turn() === "b" ? "Checkmate. You beat Doki!" : "Checkmate. Doki wins this one.");
    else say("Draw. Nobody wins, nobody loses.");
  }
  function afterPuzzle() {
    userMoves++;
    if (game.in_checkmate()) {
      done = true;
      Sound.play("flag"); say(`Checkmate! Flag: <code>${dx(LOOT.chess)}</code>`);
      dokiSay("Queen sacrifice? Respect.");
      return;
    }
    if (userMoves >= 2 || game.game_over()) { done = true; say("Not mate. Press Reset puzzle and try again."); return; }
    busy = true; say("Black replies…");
    setTimeout(() => {
      const replies = game.moves({ verbose: true });
      const safe = replies.find(m => { game.move(m); const bad = hasMateInOne(game); game.undo(); return !bad; });
      const m = safe || replies[0];
      game.move(m); last = [m.from, m.to]; busy = false; render(); Sound.play("move");
      say(safe ? "Black found a defence. Press Reset puzzle and try another idea." : "Your move. Finish it.");
      if (safe) done = true;
    }, 400);
  }
  newBtn.addEventListener("click", start);
  undoBtn.addEventListener("click", () => {
    if (busy || mode !== "play") return;
    game.undo(); if (game.turn() === "b") game.undo();
    done = false; last = null; sel = null; render(); say("Your move.");
  });
  body.querySelectorAll("[data-m]").forEach(t => t.addEventListener("click", () => {
    mode = t.dataset.m;
    body.querySelectorAll("[data-m]").forEach(x => x.setAttribute("aria-selected", String(x === t)));
    start();
  }));
  start();
}

  $("[data-mirror]", body).addEventListener("click", e => { mirror = !mirror; e.currentTarget.setAttribute("aria-pressed", String(mirror)); });
  $("[data-grid]", body).addEventListener("click", e => { showGrid = !showGrid; e.currentTarget.setAttribute("aria-pressed", String(showGrid)); fit(); });
  $("[data-size]", body).addEventListener("change", e => { snapshot(); N = +e.target.value; px = Array(N * N).fill(BG); draw(); fit(); noteEl.textContent = `New ${N}×${N} canvas`; });

  function draw() {
    cv.width = N; cv.height = N;
    for (let i = 0; i < N * N; i++) { ctx.fillStyle = px[i]; ctx.fillRect(i % N, i / N | 0, 1, 1); }
  }
  function fit() {
    const r = stage.getBoundingClientRect();
    const s = Math.max(N, Math.floor((Math.min(r.width, r.height) - 30) / N) * N);
    frame.style.width = frame.style.height = s + "px";
    const c = s / N;
    gridEl.style.background = showGrid
      ? `linear-gradient(90deg, rgba(61,43,79,.12) 1px, transparent 1px) 0 0 / ${c}px ${c}px, linear-gradient(rgba(61,43,79,.12) 1px, transparent 1px) 0 0 / ${c}px ${c}px`
      : "none";
  }
  new ResizeObserver(fit).observe(stage);
  function snapshot() { undo.push({ N, px: px.slice() }); if (undo.length > 60) undo.shift(); }
  const cellAt = e => {
    const r = cv.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) / r.width * N), y = Math.floor((e.clientY - r.top) / r.height * N);
    return x >= 0 && y >= 0 && x < N && y < N ? [x, y] : null;
  };
  function paint(x, y) {
    const c = tool === "eraser" ? BG : color;
    px[y * N + x] = c;
    if (mirror) px[y * N + (N - 1 - x)] = c;
  }
  function line(a, b) {
    let [x0, y0] = a; const [x1, y1] = b;
    const dx_ = Math.abs(x1 - x0), dy_ = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx_ + dy_;
    for (;;) { paint(x0, y0); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy_) { err += dy_; x0 += sx; } if (e2 <= dx_) { err += dx_; y0 += sy; } }
  }
  function fill(x, y) {
    const from = px[y * N + x]; if (from === color) return;
    const st = [[x, y]];
    while (st.length) {
      const [cx, cy] = st.pop(); if (cx < 0 || cy < 0 || cx >= N || cy >= N || px[cy * N + cx] !== from) continue;
      px[cy * N + cx] = color; st.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
    }
  }
  cv.addEventListener("pointerdown", e => {
    const c = cellAt(e); if (!c) return;
    if (tool === "picker") { setColor(px[c[1] * N + c[0]]); setTool("pencil"); noteEl.textContent = `Picked ${color}`; return; }
    snapshot();
    if (tool === "bucket") { fill(c[0], c[1]); draw(); return; }
    down = true; lastCell = c; cv.setPointerCapture(e.pointerId); paint(c[0], c[1]); draw();
  });
  cv.addEventListener("pointermove", e => {
    const c = cellAt(e);
    if (c) posEl.innerHTML = `x ${c[0]}, y ${c[1]} · <i style="background:${px[c[1] * N + c[0]]}"></i> ${px[c[1] * N + c[0]]}`;
    if (down && c) { line(lastCell, c); lastCell = c; draw(); }
  });
  cv.addEventListener("pointerup", () => { down = false; });
  cv.addEventListener("pointerleave", () => { if (!down) posEl.textContent = "Hover the canvas"; });
  $("[data-undo]", body).addEventListener("click", () => { const u = undo.pop(); if (!u) return; N = u.N; px = u.px; $("[data-size]", body).value = String(N); draw(); fit(); });
  $("[data-clear]", body).addEventListener("click", () => { snapshot(); px = Array(N * N).fill(BG); draw(); });
  $("[data-mystery]", body).addEventListener("click", () => {
    snapshot(); N = 32; $("[data-size]", body).value = "32"; px = Array(N * N).fill(BG);
    const HP = { k: "#0b1118", p: "#c96f6f", w: "#e7e3d8" };
    HEART.forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch === ".") return;
      for (let dy = 0; dy < 2; dy++) for (let dx2 = 0; dx2 < 2; dx2++) px[(2 + y * 2 + dy) * N + (5 + x * 2 + dx2)] = HP[ch];
    }));
    const secret = dx(LOOT.pw);
    [...secret].forEach((ch, i) => MINI[ch].forEach((row, y) => [...row].forEach((b, x) => { if (b === "1") px[(25 + y) * N + (7 + i * 4 + x)] = "#fefefe"; })));
    draw(); fit(); noteEl.textContent = "Opened mystery.pix. Just a heart. Probably.";
  });
  $("[data-save]", body).addEventListener("click", () => {
    const out = document.createElement("canvas"), k = Math.floor(512 / N);
    out.width = out.height = N * k;
    const o = out.getContext("2d");
    for (let i = 0; i < N * N; i++) { o.fillStyle = px[i]; o.fillRect((i % N) * k, (i / N | 0) * k, k, k); }
    out.toBlob(b => {
      if (!b) return;
      const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "pixel-art.png"; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      noteEl.textContent = "Saved pixel-art.png";
    });
  });
  draw(); requestAnimationFrame(fit);

  /* sketch */
  const sk = $(".sketch", body);
  const SC = ["#0b1118", "#3fa58e", "#d9a441", "#8fd1b0", "#6f8fb5", "#c96f6f", "#ffffff"];
  sk.innerHTML = `<div class="ptools">${SC.map((c, i) => `<button class="swatch" style="background:${c}" aria-label="${i === 6 ? "Eraser" : "Colour " + c}" aria-pressed="${i === 0}" data-c="${c}"></button>`).join("")}
    <span class="sep"></span><button class="btn" data-s="2" aria-pressed="false">Small</button><button class="btn" data-s="4" aria-pressed="true">Medium</button><button class="btn" data-s="8" aria-pressed="false">Big</button>
    <button class="btn" data-clear>Clear</button></div><canvas width="300" height="190" aria-label="Sketch canvas"></canvas>`;
  const scv = $("canvas", sk), sctx = scv.getContext("2d");
  let sColor = SC[0], size = 4, drawing = false, last = null;
  const sclear = () => { sctx.fillStyle = "#ffffff"; sctx.fillRect(0, 0, scv.width, scv.height); };
  sclear();
  sk.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.c) { sColor = b.dataset.c; sk.querySelectorAll(".swatch").forEach(s => s.setAttribute("aria-pressed", String(s === b))); }
    if (b.dataset.s) { size = +b.dataset.s; sk.querySelectorAll("[data-s]").forEach(s => s.setAttribute("aria-pressed", String(s === b))); }
    if ("clear" in b.dataset) sclear();
  });
  const spos = e => { const r = scv.getBoundingClientRect(); return [(e.clientX - r.left) * scv.width / r.width, (e.clientY - r.top) * scv.height / r.height]; };
  const dab = (x, y) => sctx.fillRect(Math.round(x - size / 2), Math.round(y - size / 2), size, size);
  function stroke(e) {
    const p = spos(e); sctx.fillStyle = sColor;
    const steps = Math.max(1, Math.ceil(Math.hypot(p[0] - last[0], p[1] - last[1])));
    for (let i = 0; i <= steps; i++) dab(last[0] + (p[0] - last[0]) * i / steps, last[1] + (p[1] - last[1]) * i / steps);
    last = p;
  }
  scv.addEventListener("pointerdown", e => { drawing = true; last = spos(e); scv.setPointerCapture(e.pointerId); stroke(e); });
  scv.addEventListener("pointermove", e => { if (drawing) stroke(e); });
  scv.addEventListener("pointerup", () => { drawing = false; });
}

/* ---------- Cloudsweeper ---------- */
function mountSweeper(body) {
  const N = 8, STORMS = 10;
  const intro = "Clear the sky without hitting a thundercloud. Right-click (or use Mark) to mark one.";
  body.innerHTML = `<div class="sw"><div class="swbar"><span class="swc">10</span><button class="btn face" aria-label="New game">^_^</button><button class="btn flag" aria-pressed="false">Mark</button></div><div class="swgrid"></div><p class="swmsg" role="status"></p></div>`;
  const grid = $(".swgrid", body), face = $(".face", body), flagBtn = $(".flag", body), count = $(".swc", body), msg = $(".swmsg", body);
  let cells, over, placed, flagMode = false;
  flagBtn.addEventListener("click", () => { flagMode = !flagMode; flagBtn.setAttribute("aria-pressed", String(flagMode)); });
  face.addEventListener("click", reset);
  const nb = i => { const r = Math.floor(i / N), c = i % N, o = []; for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { const rr = r + dr, cc = c + dc; if ((dr || dc) && rr >= 0 && cc >= 0 && rr < N && cc < N) o.push(rr * N + cc); } return o; };
  function reset() {
    over = false; placed = false; face.textContent = "^_^"; msg.textContent = intro;
    grid.innerHTML = "";
    cells = Array.from({ length: N * N }, (_, i) => {
      const b = document.createElement("button"); b.className = "cell"; b.setAttribute("aria-label", `Row ${Math.floor(i / N) + 1}, column ${i % N + 1}`);
      b.addEventListener("click", () => (flagMode ? flag(i) : reveal(i)));
      b.addEventListener("contextmenu", e => { e.preventDefault(); flag(i); });
      grid.appendChild(b);
      return { b, storm: false, open: false, flag: false, n: 0 };
    });
    updateCount();
  }
  function place(safe) {
    const banned = new Set([safe, ...nb(safe)]); let k = 0;
    while (k < STORMS) { const i = Math.floor(Math.random() * N * N); if (!banned.has(i) && !cells[i].storm) { cells[i].storm = true; k++; } }
    cells.forEach((c, i) => c.n = nb(i).filter(j => cells[j].storm).length);
    placed = true;
  }
  function flag(i) { const c = cells[i]; if (over || c.open) return; c.flag = !c.flag; c.b.innerHTML = c.flag ? ICONS.flag : ""; if (c.flag) c.b.querySelector("svg").style.cssText = "width:22px;height:22px;margin:auto"; updateCount(); }
  function updateCount() { count.textContent = String(STORMS - cells.filter(c => c.flag).length).padStart(2, "0"); }
  function reveal(i) {
    const c = cells[i]; if (over || c.open || c.flag) return;
    if (!placed) place(i);
    if (c.storm) {
      over = true; face.textContent = "x_x"; Sound.play("zap");
      cells.forEach(x => { if (x.storm) { x.b.innerHTML = ICONS.sweeper; x.b.classList.add("open"); x.b.querySelector("svg").style.cssText = "width:26px;height:26px;margin:auto"; } });
      c.b.classList.add("boom"); msg.textContent = "Zap. That was a thundercloud. Click the face to try again.";
      return;
    }
    const stack = [i];
    while (stack.length) {
      const j = stack.pop(), x = cells[j]; if (x.open || x.flag) continue;
      x.open = true; x.b.classList.add("open"); x.b.disabled = true;
      if (x.n) { x.b.textContent = x.n; x.b.classList.add("n" + x.n); } else nb(j).forEach(k => stack.push(k));
    }
    if (cells.every(x => x.storm || x.open)) {
      over = true; face.textContent = "B)"; Sound.play("flag");
      msg.innerHTML = `Clear skies. Flag: <code>${dx(LOOT.sweep)}</code>`;
      dokiSay("Clean sweep. Not bad.");
    }
  }
  reset();
}

function mountTrash(body) {
  body.innerHTML = `<div class="list"></div><p class="binmsg">Deleted files. Click one to look inside.</p>`;
  const list = $(".list", body), note = $(".binmsg", body);

  });
}

   ===================================================================== */
function boot(fast) {
  Sound.play("boot");
  const s = document.createElement("div");
  s.className = "screen";
  s.innerHTML = `<div class="mascot">${DOKI}</div><div class="logo">Manar OS</div><div class="tag">version 2.1</div><div class="lines"></div><div class="bar"><i></i></div><div class="skip">click to skip</div>`;
  document.body.appendChild(s);
  const lines = ["Mounting /home/manar ...... OK", "Starting window manager ... OK", "Waking up Doki ............ OK", rooted() ? "Root access ............... GRANTED" : `Hiding ${CTF.length} flags ............ OK`];
  const L = $(".lines", s);
  lines.forEach((t, i) => setTimeout(() => { const d = document.createElement("div"); d.textContent = t; L.appendChild(d); }, 200 + i * 300));
  requestAnimationFrame(() => requestAnimationFrame(() => $(".bar i", s).style.width = "100%"));
  const done = () => { if (!s.isConnected) return; s.remove(); Sound.setScene("os"); setTimeout(() => openApp("about"), 150); setTimeout(() => dokiSay("Hi, I'm Doki. I keep an eye on things here."), 900); };
  s.addEventListener("click", done);
  setTimeout(done, fast ? 300 : 1800);
}
function grantedScreen() {
  Sound.play("granted");
  const s = document.createElement("div");
  s.className = "screen";
  s.innerHTML = `<div class="mascot">${DOKI}</div><div class="granted">ACCESS GRANTED</div><div class="tag">${CTF.length}/${CTF.length} flags · ${CTF.reduce((a, c) => a + c.pts, 0)} pts · you are root</div><div class="skip">click to continue</div>`;
  document.body.appendChild(s);
  const close = () => s.remove();
  s.addEventListener("click", close);
  setTimeout(close, 3500);
}
function shutdown() {
  closeMenu();
  Sound.setScene("off"); Sound.play("shutdown");
  Object.keys(wins).forEach(closeWin);
  const s = document.createElement("div");
  s.className = "screen";
  s.innerHTML = `<div class="mascot">${DOKI}</div><div class="logo" style="font-size:clamp(24px,5vw,40px)">System halted</div><div class="tag">Shutting down…</div>`;
  document.body.appendChild(s);
  /* pull back out of the monitor to the desk; clicking the screen there logs in again */
  setTimeout(() => { playIntro(() => boot(false), true); s.remove(); }, 1400);
}

try { seen = sessionStorage.getItem("manaros-booted") === "1"; sessionStorage.setItem("manaros-booted", "1"); } catch (e) {}
if (seen) boot(true);
else playIntro(() => boot(false));
